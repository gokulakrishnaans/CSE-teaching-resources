
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OS Page Replacement Lab</title>
<style>
:root {
  font-family: system-ui, sans-serif;
  color: #172033;
  background: #f4f7fb;
}
* { box-sizing: border-box; }
body { margin: 0; }
header {
  background: #172554;
  color: white;
  padding: 28px 20px;
}
header p { color: #dbeafe; }
main { max-width: 1100px; margin: auto; padding: 22px; }
.panel {
  background: white;
  border: 1px solid #dbe3ef;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 18px;
}
.controls {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 14px;
}
label { display: block; font-weight: 600; margin-bottom: 7px; }
input {
  width: 100%;
  padding: 11px;
  border: 1px solid #b9c5d6;
  border-radius: 8px;
  font: inherit;
}
button {
  background: #1d4ed8;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 11px 16px;
  margin: 12px 8px 0 0;
  cursor: pointer;
  font-weight: 600;
}
button:hover { background: #1e40af; }
button.secondary { background: #475569; }
.note { color: #526078; font-size: .92rem; }
.results {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}
.result {
  background: white;
  border: 1px solid #dbe3ef;
  border-radius: 12px;
  padding: 15px;
  overflow-x: auto;
}
.result h3 { margin-top: 0; }
table { border-collapse: collapse; width: 100%; margin: 12px 0; }
th, td {
  border: 1px solid #d8e0eb;
  padding: 7px;
  text-align: center;
  white-space: nowrap;
}
th { background: #edf2f9; }
.fault { background: #fee2e2; color: #991b1b; font-weight: bold; }
.hit { color: #166534; font-weight: bold; }
.metric { font-size: 1.15rem; font-weight: 700; }
footer { text-align: center; padding: 20px; color: #526078; }
@media(max-width: 760px) {
  .controls, .results { grid-template-columns: 1fr; }
  main { padding: 12px; }
}
</style>
</head>
<body>
<header>
  <h1>Operating Systems: Page Replacement Lab</h1>
  <p>Explore FIFO, LRU and Optimal page replacement algorithms.</p>
</header>

<main>
  <section class="panel">
    <h2>Simulation settings</h2>
    <div class="controls">
      <div>
        <label for="pages">Page reference string</label>
        <input id="pages" value="7,0,1,2,0,3,0,4,2,3,0,3,2">
      </div>
      <div>
        <label for="frames">Number of frames (1–10)</label>
        <input id="frames" type="number" min="1" max="10" value="3">
      </div>
    </div>
    <button id="run">Run simulation</button>
    <button id="reset" class="secondary">Reset example</button>
    <p class="note">Enter page numbers separated by commas or spaces. Red cells indicate page faults.</p>
    <p id="message" role="status" aria-live="polite"></p>
  </section>

  <section class="results" id="results"></section>
</main>

<footer>
  CSE Teaching Resources · Operating Systems Practical Lab
</footer>

<script>
function simulate(pages, capacity, algorithm) {
  const frames = [];
  const history = [];
  let faults = 0;
  let queue = [];

  pages.forEach((page, i) => {
    const hit = frames.includes(page);

    if (!hit) {
      faults++;

      if (frames.length < capacity) {
        frames.push(page);
        queue.push(page);
      } else {
        let victim;

        if (algorithm === "FIFO") {
          victim = queue.shift();
        } else if (algorithm === "LRU") {
          victim = frames.reduce((oldest, p) =>
            lastUsed[p] < lastUsed[oldest] ? p : oldest
          , frames[0]);
        } else {
          const future = pages.slice(i + 1);
          victim = frames.reduce((farthest, p) => {
            const a = future.indexOf(p);
            const b = future.indexOf(farthest);
            return a === -1 || (b !== -1 && a > b)
              ? p : farthest;
          }, frames[0]);
        }

        const index = frames.indexOf(victim);
        frames[index] = page;

        if (algorithm === "FIFO") queue.push(page);
      }
    }

    lastUsed[page] = i;
    history.push({
      page,
      frames: Array.from({ length: capacity },
        (_, j) => frames[j] ?? "—"),
      fault: !hit
    });
  });

  return { history, faults };
}

let lastUsed = {};

function run() {
  const raw = document.getElementById("pages").value.trim();
  const capacity = Number(document.getElementById("frames").value);
  const message = document.getElementById("message");
  const output = document.getElementById("results");

  const tokens = raw.split(/[\s,]+/).filter(Boolean);
  const pages = tokens.map(Number);

  if (!raw || !tokens.length ||
      pages.some(p => !Number.isSafeInteger(p) || p < 0)) {
    message.textContent = "Enter valid non-negative integer page numbers.";
    output.replaceChildren();
    return;
  }

  if (!Number.isInteger(capacity) || capacity < 1 || capacity > 10) {
    message.textContent = "Choose a frame count from 1 to 10.";
    output.replaceChildren();
    return;
  }

  if (pages.length > 100) {
    message.textContent = "Use at most 100 page references per simulation.";
    output.replaceChildren();
    return;
  }

  message.textContent = "Simulation complete: " + pages.length + " references.";
  output.replaceChildren();

  ["FIFO", "LRU", "Optimal"].forEach(name => {
    lastUsed = {};
    const result = simulate(pages, capacity, name);
    const card = document.createElement("article");
    card.className = "result";

    const heading = document.createElement("h3");
    heading.textContent = name;
    card.appendChild(heading);

    const metric = document.createElement("p");
    metric.className = "metric";
    metric.textContent = "Page faults: " + result.faults +
      " · Hits: " + (pages.length - result.faults);
    card.appendChild(metric);

    const table = document.createElement("table");
    const thead = document.createElement("thead");
    const header = document.createElement("tr");

    ["Page", ...Array.from({length: capacity}, (_, i) => "F" + (i + 1)),
      "Result"].forEach(label => {
      const th = document.createElement("th");
      th.textContent = label;
      header.appendChild(th);
    });

    thead.appendChild(header);
    table.appendChild(thead);

    const tbody = document.createElement("tbody");
    result.history.forEach(row => {
      const tr = document.createElement("tr");
      const values = [row.page, ...row.frames,
        row.fault ? "FAULT" : "HIT"];

      values.forEach((value, index) => {
        const td = document.createElement("td");
        td.textContent = value;
        if (index === values.length - 1) {
          td.className = row.fault ? "fault" : "hit";
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    card.appendChild(table);
    output.appendChild(card);
  });
}

document.getElementById("run").addEventListener("click", run);
document.getElementById("reset").addEventListener("click", () => {
  document.getElementById("pages").value =
    "7,0,1,2,0,3,0,4,2,3,0,3,2";
  document.getElementById("frames").value = 3;
  run();
});

run();
</script>
</body>
</html>
